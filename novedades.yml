name: Actualizar novedades
on:
  schedule:
    - cron: '0 9 * * *'   # todos los días 09:00 UTC = 06:00 Argentina
  workflow_dispatch:        # permite ejecutarlo a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/novedades.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "zonebyte-bot"
          git config user.email "bot@users.noreply.github.com"
          git add novedades.json
          git diff --staged --quiet || (git commit -m "Novedades automáticas" && git push)
